server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Résolution DNS différée via le resolver Docker interne
    resolver 127.0.0.11 valid=10s;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self' https://nominatim.openstreetmap.org https://*.tile.openstreetmap.org; img-src 'self' https://*.tile.openstreetmap.org data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self' https://cdn.jsdelivr.net; font-src 'self';" always;

    # Proxy ressources GeoOrchestra (header web component, assets)
    location /header/ {
        proxy_pass https://geobretagne.fr/header/;
        proxy_set_header Host geobretagne.fr;
    }

    location /pub/ {
        proxy_pass https://geobretagne.fr/pub/;
        proxy_set_header Host geobretagne.fr;
    }

    location /static/ {
        proxy_pass https://geobretagne.fr/static/;
        proxy_set_header Host geobretagne.fr;
    }

    # Proxy API → backend (SSE-compatible)
    location ${BASE_PATH}/api/ {
        set $backend http://backend:3000;
        rewrite ^${BASE_PATH}(/.*)$ $1 break;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Streaming / SSE
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        proxy_read_timeout 120s;
    }

    # Redirection ${BASE_PATH} → ${BASE_PATH}/
    location = ${BASE_PATH} {
        return 301 ${BASE_PATH}/;
    }

    # SPA fallback — toutes les routes ${BASE_PATH}/* → index.html
    location ${BASE_PATH}/ {
        try_files $uri $uri/ ${BASE_PATH}/index.html;
    }

    # Cache assets
    location ~* \.(?:js|css|woff2?|svg|png|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
